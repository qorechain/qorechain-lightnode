name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # No cross-compilation toolchain and no native libraries: the PQC
      # implementation is pure Go (cloudflare/circl), so every target builds
      # from any host with CGO off. Do not reintroduce CGO here — that is what
      # silently shipped Windows and macOS binaries whose keygen, sign and
      # verify all returned errors.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          suffix="${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          for edition in sx ux; do
            out="lightnode-${edition}-${suffix}"
            go build -trimpath -ldflags "-s -w" -o "$out" "./cmd/lightnode-${edition}/"
            # Fail loudly rather than uploading something that is not there.
            test -s "$out"
            echo "built $out ($(du -h "$out" | cut -f1))"
          done

      - name: Verify the binary carries no native dependency
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          if ldd lightnode-sx-linux-amd64 2>&1 | grep -q "libqorepqc"; then
            echo "binary still links libqorepqc - CGO leaked back in"
            exit 1
          fi
          echo "no libqorepqc linkage"

      - name: Run tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            lightnode-sx-*
            lightnode-ux-*
            qorepqc.*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
