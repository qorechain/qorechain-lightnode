name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # No cross-compilation toolchain and no native libraries: the PQC
      # implementation is pure Go (cloudflare/circl), so every target builds
      # from any host with CGO off. Do not reintroduce CGO here — that is what
      # silently shipped Windows and macOS binaries whose keygen, sign and
      # verify all returned errors.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          suffix="${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          for edition in sx ux; do
            out="lightnode-${edition}-${suffix}"
            go build -trimpath -ldflags "-s -w" -o "$out" "./cmd/lightnode-${edition}/"
            # Fail loudly rather than uploading something that is not there.
            test -s "$out"
            echo "built $out ($(du -h "$out" | cut -f1))"
          done

      - name: Verify the binary carries no native dependency
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          if ldd lightnode-sx-linux-amd64 2>&1 | grep -q "libqorepqc"; then
            echo "binary still links libqorepqc - CGO leaked back in"
            exit 1
          fi
          echo "no libqorepqc linkage"

      - name: Run tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # Only the binaries. The libqorepqc.so / .dylib pair that earlier releases
      # carried is dead weight now that PQC is pure Go, and shipping it invites
      # an operator to place a stale native library next to a binary that does
      # not load one.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            lightnode-sx-*
            lightnode-ux-*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # An operator who downloads a node binary and cannot verify it is a
      # supply-chain hole we opened ourselves. The build manifest additionally
      # lets a downloads page be generated rather than hand-maintained; it
      # deliberately carries NO network or chain id, because a tag means "this
      # code exists", not "this is blessed for network N". Blessing happens in
      # qore-lightnode-release.sh, per network, testnet first.
      - name: Checksums and build manifest
        run: |
          set -euo pipefail
          cd dist
          ver="${GITHUB_REF_NAME#v}"
          sha256sum lightnode-* > SHA256SUMS
          python3 - "$ver" <<'PY' > lightnode-build.json
          import hashlib, json, os, re, sys

          ver = sys.argv[1]
          artifacts = []
          for name in sorted(os.listdir(".")):
              m = re.fullmatch(r"lightnode-(sx|ux)-(linux|darwin|windows)-(amd64|arm64)(\.exe)?", name)
              if not m:
                  continue
              edition, goos, goarch, _ = m.groups()
              with open(name, "rb") as fh:
                  digest = hashlib.sha256(fh.read()).hexdigest()
              artifacts.append({
                  "edition": edition,
                  "os": goos,
                  "arch": goarch,
                  "filename": name,
                  "sha256": digest,
                  "sizeBytes": os.path.getsize(name),
              })
          print(json.dumps({
              "component": "lightnode",
              "version": ver,
              "artifactCount": len(artifacts),
              "artifacts": artifacts,
          }, indent=2))
          PY
          # Two editions across six targets. A short count means a matrix leg
          # failed while the release still succeeded, and a downloads page built
          # from this manifest would quietly lose a platform.
          count=$(python3 -c 'import json;print(json.load(open("lightnode-build.json"))["artifactCount"])')
          if [ "$count" != "12" ]; then
            echo "expected 12 artifacts, got $count"
            exit 1
          fi
          echo "12 artifacts, checksums written"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
