services:
  lightnode-sx:
    build:
      context: .
      dockerfile: Dockerfile.sx
    container_name: qorechain-lightnode-sx
    volumes:
      - sx-data:/root/.qorechain-lightnode
      # The qorechaind home holding the operator key (keyring) and the exported
      # node key under pqc/<name>.dilithium. The bundled qorechaind signs
      # heartbeats and reward claims from it. Point QORECHAIND_HOME at yours.
      - ${QORECHAIND_HOME:-~/.qorechaind}:/root/.qorechaind
    environment:
      - QORECHAIN_RPC_ADDR=${QORECHAIN_RPC_ADDR:-http://host.docker.internal:26657}
      # Passphrase of the node keyring (backend "file"); required, never defaulted.
      - QORE_LIGHTNODE_KEYRING_PASSPHRASE
      # Passphrase of the qorechaind keyring that holds the operator key, piped
      # to qorechaind on stdin so it never appears on a command line.
      - QORE_LIGHTNODE_QORECHAIND_PASSPHRASE
    restart: unless-stopped

  lightnode-ux:
    build:
      context: .
      dockerfile: Dockerfile.ux
    container_name: qorechain-lightnode-ux
    ports:
      - "8420:8420"
    volumes:
      - ux-data:/root/.qorechain-lightnode
    environment:
      - QORECHAIN_RPC_ADDR=${QORECHAIN_RPC_ADDR:-http://host.docker.internal:26657}
      - QORE_LIGHTNODE_KEYRING_PASSPHRASE
    restart: unless-stopped

volumes:
  sx-data:
  ux-data:
