services:
  lightnode-sx:
    build:
      context: .
      dockerfile: Dockerfile.sx
    container_name: qorechain-lightnode-sx
    volumes:
      - sx-data:/root/.qorechain-lightnode
      # Only for the qorechaind fallback (nodes whose operator key lives in a
      # qorechaind keyring). Since 3.1.8 the node signs natively from its own
      # keyring after `keys add-operator`, and this mount is unused.
      - ${QORECHAIND_HOME:-~/.qorechaind}:/root/.qorechaind
    environment:
      - QORECHAIN_RPC_ADDR=${QORECHAIN_RPC_ADDR:-https://rpc.qore.host}
      # Passphrase of the node keyring (backend "file"); required, never defaulted.
      - QORE_LIGHTNODE_KEYRING_PASSPHRASE
      # qorechaind fallback only: passphrase of its keyring, piped on stdin.
      - QORE_LIGHTNODE_QORECHAIND_PASSPHRASE
    restart: unless-stopped

  lightnode-ux:
    build:
      context: .
      dockerfile: Dockerfile.ux
    container_name: qorechain-lightnode-ux
    ports:
      - "8420:8420"
    volumes:
      - ux-data:/root/.qorechain-lightnode
    environment:
      - QORECHAIN_RPC_ADDR=${QORECHAIN_RPC_ADDR:-https://rpc.qore.host}
      - QORE_LIGHTNODE_KEYRING_PASSPHRASE
    restart: unless-stopped

volumes:
  sx-data:
  ux-data:
