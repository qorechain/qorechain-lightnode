# QoreChain light node configuration (~/.qorechain-lightnode/config.toml).
# `lightnode-sx onboard` writes this file; the values below are the defaults
# with the ones an operator normally changes filled in.

node_type = "sx"
chain_id  = "qorechain-vladi"          # mainnet; testnet is qorechain-diana
rpc_addr  = "https://rpc.qore.host"    # or your own node, http://localhost:26657
# api_addr = "https://api.qore.host"   # REST endpoint; derived from rpc_addr when empty
primary_addr  = "https://rpc.qore.host"
witness_addrs = []

data_dir        = ""                   # empty = ~/.qorechain-lightnode
keyring_backend = "file"               # file (passphrase from QORE_LIGHTNODE_KEYRING_PASSPHRASE), os, or test
key_name        = "operator"           # the node's post-quantum key; also the qorechaind key name by default

# Top-level, so before the first [table]. Placed after [dashboard], as they were
# until 3.1.6, TOML reads them as dashboard settings and they are ignored.
log_level  = "info"                    # debug, info, warn, error
log_format = "text"                    # text, json

# The account this node belongs to. A post-quantum node key has no address of
# its own; it is attached to this account. `keys add-operator` sets this.
operator_address = ""

[heartbeat]
enabled         = true
check_interval  = "60s"
interval_blocks = 1000                 # the chain's heartbeat_interval
qorechaind_path = ""                   # empty = "qorechaind" on PATH (the Docker image ships it)
qorechaind_home = ""                   # empty = ~/.qorechaind (operator key + pqc/<key_name>.dilithium)
fees            = "50000uqor"
gas             = "300000"

[delegation]
auto_claim        = false              # claim accrued light node rewards to the operator wallet
compound_interval = "1h"
min_reward_claim  = "1000000"          # 1 QOR
validators        = []
split_weights     = []
rebalance_enabled = true               # warn when a validator you delegate to is jailed or leaves
                                       # the active set, or your bonded stake falls below the minimum
min_reputation    = 0.5                # warn below this validator reputation, once the network publishes scores

[telemetry]
enabled = true

[update]
# "auto": announce new releases and install them, then restart. A release is
# installed only if its checksums carry the QoreChain release signature and the
# new binary runs and reports the expected version; the previous binary is kept
# next to it as <name>.old. "notify": announce only. "off": do not check.
# In a container, or when the binary's folder is not writable, the node only
# announces: update the image or the file yourself.
mode = "auto"

[dashboard]
# The local API QoreX pairs with. The UX build always serves it; the SX build
# serves it only when enabled here.
enabled   = false
bind_addr = "127.0.0.1:8420"
# When set, every /api route and /ws require `Authorization: Bearer <token>`.
# Set it whenever bind_addr is reachable from anywhere but this machine, and
# enter the same token in QoreX when pairing.
token     = ""
